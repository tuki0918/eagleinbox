name: Deploy Eagle Inbox website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "privacy-policy/**"
      - ".github/workflows/deploy-privacy-policy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify site files
        run: |
          test -f privacy-policy/index.html
          test -f privacy-policy/privacy/index.html
          test -f privacy-policy/privacy/ja.html
          test -f privacy-policy/commerce/index.html
          test -f privacy-policy/CNAME
          test -f privacy-policy/styles.css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: privacy-policy

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
